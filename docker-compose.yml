services:
  kafka:
    image: apache/kafka:3.7.0  # Use the latest version of Kafka
    container_name: kafka-broker # Kafka broker container name
    ports:
      - "9092:9092" # Acess point port
    environment:
      KAFKA_NODE_ID: 1 # Unique identifier for the Kafka broker
      KAFKA_PROCESS_ROLES: broker,controller # Role of the kafka server/ broker
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:29092 # Listeners for different protocols
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092 # Advertised listeners for external and internal access
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER # Listener name for the controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT 
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 6 # Number of partitions for topics

  kafka-ui:
    image: provectuslabs/kafka-ui:latest # Download the latest version of kafka ui 
    container_name: kafka-ui # Kafka UI container name
    ports: 
      - "8080:8080" # Port mapping for kafka UI so that we can access it through localhost:8080 from chrome / browsers
    environment:
      KAFKA_CLUSTERS_0_NAME: local-fraud-cluster 
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
